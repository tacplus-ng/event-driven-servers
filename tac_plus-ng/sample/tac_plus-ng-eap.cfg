#!../../../sbin/tac_plus-ng

# RADIUS EAP-TLS termination.
#
# tac_plus-ng terminates EAP-TLS itself; it does not proxy EAP to an external
# server. EAP-TLS is the only supported EAP method in this phase.
#
# How to test, from this directory after "make -C democa":
#
#     eapol_test -c eap-tls.conf -a 127.0.0.1 -p 1812 -s demo
#
# eap-tls.conf:
#   network={
#       key_mgmt=IEEE8021X
#       eap=TLS
#       identity="client.demo.local"
#       ca_cert="democa/root.crt"
#       client_cert="democa/client-chain.pem"
#       private_key="democa/client.key"
#   }
#
# eapol_test comes with hostapd/wpa_supplicant. Port 1812 is privileged, so
# run the daemon as root or with CAP_NET_BIND_SERVICE. The device's
# radius.key is "demo".
#
# The server certificate/key and the CA that signs the EAP peer's client
# certificate are the demo CA files generated by sample/democa:
#
#     make -C tac_plus-ng/sample/democa
#
# The EAP peer needs a client certificate signed by the same CA and carrying
# the clientAuth extended key usage; the server verifies it against ca-file.
# The demo client certificate has CN client.demo.local and is issued by the
# intermediate CA, so the peer must send the intermediate chain:
# democa/client-chain.pem (or democa/client.p12 for clients that import a
# PKCS#12 file). ca-file stays root.crt: the server trusts the root, and the
# intermediate comes from the chain the peer sends, not from ca-file.
#
# Identity: with eap-identity-source = cert-cn, the user name is the CN of the
# peer certificate, lowercased. Define the matching user in lower case; this
# sample's "client.demo.local" expects a certificate with CN
# "client.demo.local" (or "CLIENT.DEMO.LOCAL", which is lowercased before the
# lookup). Certificate SANs are handled the same way with
# eap-identity-source = cert-san.
#
# MFA: if the selected user or host requires MFA, EAP authentication is
# rejected with EAP-Failure. MFA cannot be challenged inside EAP-TLS.
#
# UDP: spawnd receives each RADIUS/UDP datagram and hands the flow to a worker
# through a connected DGRAM socket bound to the listener address/port and
# connected to the NAS source address/port, so all packets of an EAP
# conversation stay on the worker that owns the flow.
# Multi-worker UDP EAP therefore works without "single process = yes", without
# "sticky cache period", and without a broker. EAP state is still per worker.
# A context that carries an EAP session is held open while the session is
# unexpired, even if "stateless timeout" (30 s by default) or
# "single-connection may-close = yes" would close it earlier. A retiring worker therefore stays
# alive and keeps receiving the flow until the hold lapses: an upper bound of
# about eap timeout (60 s by default) plus one 60 s periodics tick after the
# last advance. A NAS source-port change, a lost worker, and LRU eviction are
# not covered: the State lookup then fails closed and the NAS must restart
# EAP. TCP/TLS contexts get the same hold against may-close, but not against
# "connection timeout" (600 s by default); keep that longer than eap timeout.
#
# "single process = yes" is not required for UDP EAP. It remains a test-only
# mode (one process, no worker separation); this sample leaves it out.
#
# TLS profile: this implementation deliberately requires TLS 1.2 and modern
# ciphers. RFC 5216 requires TLS 1.0 and lists 3DES/RC4 suites; those are
# deprecated by RFC 8996. Compression, session resumption, and EAP privacy/
# fast reconnect are not negotiated. TLS 1.3 (RFC 9190) is a follow-up.
#
# To disable EAP inherited from the default realm in a child realm:
#
#     realm lab {
#         eap = no
#     }

id = spawnd {
	background = no
	# EAP over RADIUS/TLS (RadSec) pins the conversation to one worker.
	# Uncomment this together with the tls credentials below.
	# listen { port = 2083 tls = yes }
	# RADIUS over UDP: spawnd's connected DGRAM socket keeps an EAP flow on
	# one worker; no single process or sticky cache is needed.
	listen { port = 1812 protocol = UDP }
	listen { port = 1813 protocol = UDP flag = accounting }
}

id = tac_plus-ng {
	include = $CONFDIR/radius-dict.cfg

	eap {
		eap-method = tls
		cert-file = $CONFDIR/democa/server-chain.pem
		key-file = $CONFDIR/democa/server.key
		ca-file = $CONFDIR/democa/root.crt
		verify-client = yes
		eap-identity-source = cert-cn
		timeout = 60
		max-message = 65535
		max-sessions = 4096
	}

	# TLS server credentials for a RadSec listener (see the commented listen
	# line above). EAP-TLS uses the dedicated eap block; do not share an
	# EAP-TLS server key with HTTPS or other services in production
	# (RFC 5216 5.1).
	tls cert-file = $CONFDIR/democa/server-chain.pem
	tls key-file = $CONFDIR/democa/server.key
	tls ca-file = $CONFDIR/democa/root.crt

	device world {
		address = ::/0
		radius.key = demo
	}

	profile eap-profile {
		script {
			if (aaa.protocol == radius) {
				set radius[Cisco:Cisco-AVPair] = "shell:priv-lvl=15"
				permit
			}
		}
	}

	# The name comes from the lowercased certificate identity.
	user client.demo.local {
		profile = eap-profile
	}
}
